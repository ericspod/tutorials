name: premerge-notebooks

on:
  # quick tests of modified notebooks for every pull request
  push:
    branches:
      - main
  pull_request:

concurrency:
  # automatically cancel the previously triggered workflows when there's a newer version
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/checkout@v7
      repository: https://github.com/Project-MONAI/MONAI
      path: monai
    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Install MONAI
      id: monai-install
      run: |
        which python
        python -m pip install -U pip wheel
        (cd monai; BUILD_MONAI=0 pip install .[all])
        python -m pip install -r requirements.txt
        python -m pip list
    - name: Notebook quick check
      shell: bash
      run: |
        python -m monai.config
        git fetch origin main
        git diff --name-only origin/main | while read line
        do
          if [[ $line == *.ipynb ]]
          then
            ./runner.sh -p " -and -wholename './${line}'"
          fi
        done
